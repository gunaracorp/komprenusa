<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KOMPRESA — The Compressor and Cooling Parts Center">
  <defs>
    <!-- Latar banner -->
    <linearGradient id="bn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0d5f5a"/>
    </linearGradient>
    <!-- Gradien emblem (identik dengan LogoMark resmi) -->
    <linearGradient id="bn-ebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="bn-eglow" cx="30%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Emas wordmark -->
    <linearGradient id="bn-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Bar bawah -->
    <linearGradient id="bn-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="bn-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#14b8a6" stroke-opacity="0.06"/>
    </pattern>
    <radialGradient id="bn-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Latar + grid + halo -->
  <rect width="1200" height="340" fill="url(#bn-bg)"/>
  <rect width="1200" height="340" fill="url(#bn-grid)"/>
  <ellipse cx="156" cy="170" rx="300" ry="240" fill="url(#bn-halo)"/>

  <!-- Salju dekoratif besar (kanan atas, sangat halus) -->
  <g transform="translate(1062,96) scale(0.46) translate(-256,-256)" opacity="0.05" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="206"/>
    <use href="#bn-spoke"/>
    <use href="#bn-spoke" transform="rotate(60 256 256)"/>
    <use href="#bn-spoke" transform="rotate(120 256 256)"/>
    <use href="#bn-spoke" transform="rotate(180 256 256)"/>
    <use href="#bn-spoke" transform="rotate(240 256 256)"/>
    <use href="#bn-spoke" transform="rotate(300 256 256)"/>
  </g>

  <!-- ══ EMBLEM RESMI KOMPRESA (replika LogoMark, geometri 512 asli) ══ -->
  <g transform="translate(56,70) scale(0.391)">
    <defs>
      <g id="bn-spoke">
        <path d="M 256 250 L 256 110"/>
        <path d="M 256 172 L 226 142"/>
        <path d="M 256 172 L 286 142"/>
        <path d="M 256 128 L 233 105"/>
        <path d="M 256 128 L 279 105"/>
      </g>
    </defs>
    <rect width="512" height="512" rx="112" fill="url(#bn-ebg)"/>
    <rect width="512" height="512" rx="112" fill="url(#bn-eglow)"/>
    <circle cx="256" cy="256" r="206" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.92"/>
    <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none">
      <use href="#bn-spoke"/>
      <use href="#bn-spoke" transform="rotate(60 256 256)"/>
      <use href="#bn-spoke" transform="rotate(120 256 256)"/>
      <use href="#bn-spoke" transform="rotate(180 256 256)"/>
      <use href="#bn-spoke" transform="rotate(240 256 256)"/>
      <use href="#bn-spoke" transform="rotate(300 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="36" fill="#f59e0b"/>
    <circle cx="256" cy="256" r="15" fill="#042f2e"/>
  </g>

  <!-- ══ WORDMARK ══ -->
  <text x="310" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="96" letter-spacing="1" fill="#f8fafc">KOMPRES<tspan fill="url(#bn-gold)">A</tspan></text>

  <!-- Tagline EN resmi -->
  <rect x="310" y="190" width="26" height="4.5" rx="2.25" fill="#f59e0b"/>
  <text x="348" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="17" letter-spacing="4.2" fill="#5eead4">COMPRESSOR &amp; COOLING PARTS CENTER</text>

  <!-- Tagline ID resmi -->
  <text x="310" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">Pusat Kompresor AC dan Spare Part Pendingin Indonesia</text>

  <!-- ══ CHIPS ══ -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="15" letter-spacing="1">
    <rect x="310" y="258" width="168" height="42" rx="21" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.85"/>
    <text x="394" y="285" text-anchor="middle" fill="#fbbf24">v2.0.0 · GARUDA</text>

    <rect x="492" y="258" width="134" height="42" rx="21" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="559" y="285" text-anchor="middle" fill="#e2e8f0">NEXT.JS 16</text>

    <rect x="640" y="258" width="116" height="42" rx="21" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="698" y="285" text-anchor="middle" fill="#e2e8f0">REACT 19</text>

    <rect x="770" y="258" width="140" height="42" rx="21" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="840" y="285" text-anchor="middle" fill="#e2e8f0">TAILWIND 4</text>

    <rect x="924" y="258" width="134" height="42" rx="21" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="991" y="285" text-anchor="middle" fill="#e2e8f0">SEJAK 2008</text>
  </g>

  <!-- Bar bawah -->
  <rect x="0" y="335" width="1200" height="5" fill="url(#bn-bar)"/>
</svg>
