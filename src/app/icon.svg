<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo KompresNusa">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Latar: gradien teal pekat (dingin, tepercaya) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Cincin emas kompresnusa -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.92"/>

  <!-- Kepingan salju: satu lengan, diputar 6x -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none">
    <g id="spoke">
      <path d="M 256 250 L 256 110"/>
      <path d="M 256 172 L 226 142"/>
      <path d="M 256 172 L 286 142"/>
      <path d="M 256 128 L 233 105"/>
      <path d="M 256 128 L 279 105"/>
    </g>
    <use href="#spoke" transform="rotate(60 256 256)"/>
    <use href="#spoke" transform="rotate(120 256 256)"/>
    <use href="#spoke" transform="rotate(180 256 256)"/>
    <use href="#spoke" transform="rotate(240 256 256)"/>
    <use href="#spoke" transform="rotate(300 256 256)"/>
  </g>

  <!-- Hub emas: jantung kompresor -->
  <circle cx="256" cy="256" r="36" fill="#f59e0b"/>
  <circle cx="256" cy="256" r="15" fill="#042f2e"/>
</svg>
